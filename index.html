<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>OpenCAD SketchUp 뷰어 · SKP 파일 3D 보기</title>
    <meta
      name="description"
      content="SketchUp 2021~2026(.skp) 파일을 설치 없이 브라우저에서 3D로 여는 무료 뷰어입니다. 태그 켜고 끄기, 재질·그룹·컴포넌트 보기, 두 점 측정, PNG 저장을 지원하며 파일은 서버로 보내지 않습니다."
    />
    <meta name="theme-color" content="#1b2027" />
    <meta property="og:title" content="OpenCAD SketchUp 뷰어 · SKP 파일 3D 보기" />
    <meta property="og:description" content="SketchUp(.skp) 모형을 브라우저에서 바로 3D로 보는 무료 오픈소스 뷰어" />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <script>
      // 첫 그림 전에 테마를 정한다(깜빡임 방지). 기억한 선택이 없으면 시스템 설정을 따른다.
      (function () {
        var t = null;
        try {
          t = localStorage.getItem('opencad-skp.theme');
        } catch (e) {}
        if (t !== 'light' && t !== 'dark') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
      })();
    </script>
    <style>
      .site-intro { max-width: 760px; margin: 0 auto; padding: 32px 16px; font: 16px/1.7 system-ui, sans-serif; }
      .site-intro h1 { font-size: 26px; line-height: 1.3; }
    </style>
  </head>
  <body>
    <div id="app">
      <!-- 앱이 준비되면 같은 내용을 안내하는 시작 화면으로 바뀝니다. -->
      <main class="site-intro">
        <h1>OpenCAD SketchUp 뷰어</h1>
        <p>SketchUp 2021~2026에서 저장한 .skp 파일을 설치 없이 브라우저에서 3D로 엽니다. 태그를 켜고 끄고, 재질과 그룹·컴포넌트를 살펴보고, 두 점 사이 거리를 잴 수 있습니다.</p>
        <p>파일은 서버로 보내지 않고 이 브라우저 안에서 읽습니다. JavaScript와 WebGL2를 지원하는 최신 브라우저가 필요합니다.</p>
        <p><a href="https://gyutae-kim.github.io/opencad">OpenCAD 도구 목록</a> · <a href="https://github.com/GyuTae-Kim/opencad-skp">GitHub 소스 코드</a></p>
        <p><small>SketchUp은 Trimble Inc.의 상표이며, 이 프로젝트는 Trimble과 관계가 없습니다.</small></p>
      </main>
    </div>
    <noscript>이 뷰어는 JavaScript가 필요합니다.</noscript>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
