name: CI

# main에 들어간 커밋은 deploy.yml이 같은 확인(타입·시험·빌드)을 거친 뒤 게시한다
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 같은 PR에 새 커밋을 올리면 앞 실행을 멈춘다
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # CI 8차: 시험 파일(114개 — 한 러너에서 약 60~95초)을 러너 두 대에 나눠 동시에 돈다(vitest --shard). 조각은 앞 CI에서 잰 파일 무게표
    # (tests/shard-weights.json)로 무거운 것부터 가장 가벼운 조각에 넣는다(tests/weighted-sequencer.ts — DWG·DXF CI 2차 꼴).
    # CI 6·7차로 휴대폰 검사가 약 70초로 줄어 시험 작업이 PR 벽시계를 쥐었다
    # CI 18차: 러너를 세 대로 늘린다. 한 파일이 39~61초로 조각 하나의 시간을 혼자 정하던 uilang214를 언어 걸음 두 묶음(uilang214·uilang214b —
    # 본문 uilang214.cases.ts)으로 나눴더니, 두 대에서는 무거운 DOM 시험이 한 러너에서 더 겹쳐 돌며 서로 늦췄다(시험 안 시간 기다림이 늦게 깨어 —
    # 같은 커밋 두 번 vitest 73/54·75/74초, 시험 시간 합 231·270초 ← 나누기 전 165~214초). 한 러너 안 병렬이 아니라 러너 수가 몫을 줄인다.
    # 무게표는 최근 일곱 실행(234~238차 PR, 이 PR 두 번)의 파일별 최댓값(DWG·DXF CI 16차 꼴 — 무거운 파일일수록 실행마다 출렁인다)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    name: test (${{ matrix.shard }}/3)
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # CI 6차: main으로 가는 PR에서는 휴대폰 검사(mobile-validation.yml)가 같은 npm run test:seo와 npm run build(tsc --noEmit — typecheck와 같은 일 —
      # · vite build · check:seo · check:i18n)를 돌리므로 여기서는 시험만 돌린다. 다른 base의 PR과 손으로 돌린 실행에서는 전처럼 모두 돌린다
      - run: npm run typecheck
        if: ${{ matrix.shard == 1 && !(github.event_name == 'pull_request' && github.base_ref == 'main') }}
      - run: npx vitest run --shard=${{ matrix.shard }}/3
      - run: npm run test:seo
        if: ${{ matrix.shard == 1 && !(github.event_name == 'pull_request' && github.base_ref == 'main') }}
      - run: npm run build
        if: ${{ matrix.shard == 1 && !(github.event_name == 'pull_request' && github.base_ref == 'main') }}
